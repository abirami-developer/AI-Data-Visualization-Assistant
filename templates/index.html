<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>AI Data Visualization Assistant</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="/static/css/style.css">

</head>

<body>

    <div class="container mt-5">

        <h1 class="text-center">
            AI Data Visualization Assistant
        </h1>

        <p class="text-center text-muted">
            Upload your CSV or JSON dataset
        </p>

        <!-- Upload Form -->
        <form id="uploadForm">

            <input
                type="file"
                class="form-control"
                id="fileInput"
                name="file"
                accept=".csv,.json"
                required>

            <button
                type="submit"
                class="btn btn-primary mt-3">

                Upload

            </button>

        </form>

        <!-- Loading Spinner -->
        <div
            id="loading"
            class="text-center mt-4"
            style="display:none;">

            <div
                class="spinner-border text-primary"
                role="status">

            </div>

            <p class="mt-2">
                Uploading dataset...
            </p>

        </div>

        <!-- Success / Error Message -->
        <div
            id="message"
            class="mt-4">

        </div>

        <!-- Dataset Schema -->
        <div
            id="schemaSection"
            class="mt-5"
            style="display:none;">

            <h3>Dataset Information</h3>

            <ul class="list-group">

                <li class="list-group-item">
                    <strong>Rows:</strong>
                    <span id="rows"></span>
                </li>

                <li class="list-group-item">
                    <strong>Columns:</strong>
                    <span id="columns"></span>
                </li>

                <li class="list-group-item">
                    <strong>Column Names:</strong>
                    <span id="columnNames"></span>
                </li>

                <li class="list-group-item">
                    <strong>Data Types:</strong>
                    <span id="dataTypes"></span>
                </li>

            </ul>

        </div>

        <!-- Dataset Preview -->
        <div
            id="previewSection"
            class="mt-5"
            style="display:none;">

            <h3>Dataset Preview</h3>

            <div class="table-responsive">

                <table
                    id="previewTable"
                    class="table table-bordered table-striped">

                </table>

            </div>

        </div>

        <!-- Visualization Request -->
        <div
            id="visualizationSection"
            class="mt-5"
            style="display:none;">

            <h3>Visualization Request</h3>

            <p class="text-muted">
                Describe the chart you want in natural language.
            </p>

            <form id="promptForm">

                <input
                    type="text"
                    id="promptInput"
                    class="form-control"
                    placeholder="Example: Create a bar chart of Rating by Category"
                    required>

                <div id="samplePrompts" class="mt-3"></div>

                <button
                    type="submit"
                    class="btn btn-success mt-3">

                    Generate Visualization

                </button>

            </form>

            <!-- Parsed Prompt -->
            <div id="promptResult" class="mt-4"></div>

            <!-- Generated Chart -->
            <div id="chartContainer" class="mt-4"></div>
            <div class="mt-3">
    <button
        id="downloadHtmlBtn"
        class="btn btn-primary"
        style="display: none;">
        Download Chart (HTML)
    </button>
</div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Plotly -->
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

    <!-- Custom JavaScript -->
    <script src="/static/js/script.js"></script>

</body>

</html>
